# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]
line-length = 88
target-version = "py312"

[lint]
# Enable rules for Pyflakes (F) and pycodestyle (E).
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM", "DJ"]
ignore = ["E501", "DJ001"]
fixable = ["ALL"]
unfixable = []

[lint.mccabe]
max-complexity = 10
