[project]
name = "django-intro"
version = "0.1.0"
description = "Café des Nations - Django Project"
readme = "README.md"
authors = [
    { name = "aptitek", email = "aptitek@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.0.0",
    "django-environ>=0.14.0",
    "gunicorn>=26.0.0",
    "openai>=2.53.0",
    "whitenoise>=6.6.0",
]

[tool.pyrefly]
import-roots = ["."]
search-paths = ["."]
ignore-missing-imports = true
reportUntypedImport = false
reportMissingImports = false

[tool.pyright]
include = ["."]
extraPaths = ["."]
reportMissingImports = false
reportUntypedImport = false
